apiVersion: 1

# Источники подключаются при старте Grafana, руками ничего настраивать не нужно.
# Переменные $POSTGRES_* приходят в контейнер grafana из .env.
datasources:
  - name: Prometheus
    uid: fraud-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 1s
      httpMethod: POST

  - name: PostgreSQL
    uid: fraud-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: $POSTGRES_HOST:$POSTGRES_PORT
    user: $POSTGRES_USER
    editable: false
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: $POSTGRES_PASSWORD
